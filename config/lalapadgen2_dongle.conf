# 電池で動いているときだけ、触らない時間が続いたら自動で寝る（切り忘れ対策）。
# ZMK は USB から電気が来ている間は寝ないので、Mac や iPad に挿している間は影響しない。
# キーもトラックパッドも「使っている」に数えられる。起こすときは XIAO のリセットボタン。
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# ドングルにはトラックパッドも充電表示も付いていない（共通設定の y を打ち消す）
CONFIG_INPUT_IQS9151=n
CONFIG_ZMK_EASY_CHARGE_INDICATOR=n
